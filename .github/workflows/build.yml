name: Build website
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 4

      # BEGIN TEMPORARY SECTION
      - name: Checkout the old website
        uses: actions/checkout@v6
        with:
          repository: inspircd/website
          path: old-website

      - name: Copy files from website
        run: |-
          cp -R ${{ github.workspace }}/old-website/_posts _posts
          rm -fr ${{ github.workspace}}/old-website
      # END TEMPORARY SECTION

      - name: Build website
        run: |-
          bundle exec jekyll build

      - name: Upload GitHub artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
